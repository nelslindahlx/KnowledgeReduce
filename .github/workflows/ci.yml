# GitHub Actions automatic triggers are disabled to avoid consuming GitHub Action minutes.
# Execute local CI via `make local-ci` or `uv run --no-sync pytest`.
name: CI

on:
  workflow_dispatch:

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra dev

      - name: Canary import & governance meta-gate
        run: |
          uv run --python ${{ matrix.python-version }} python -W error::Warning -c "import knowledgereduce"
          uv run --python ${{ matrix.python-version }} pytest tests/meta/ -q

      - name: Lint with ruff
        run: uv run --python ${{ matrix.python-version }} ruff check src tests examples benchmarks scripts

      - name: Check formatting with ruff
        run: uv run --python ${{ matrix.python-version }} ruff format --check src tests examples benchmarks scripts

      - name: Type check with mypy
        run: uv run --python ${{ matrix.python-version }} mypy --strict src

      - name: Run pytest with coverage gate
        run: |
          uv run --python ${{ matrix.python-version }} pytest \
            --cov=knowledgereduce \
            --cov-report=term-missing \
            --cov-fail-under=95

      - name: Run offline examples
        if: matrix.python-version == '3.12'
        run: |
          for script in examples/*.py; do
            uv run --python ${{ matrix.python-version }} python "$script"
          done

      - name: Validate and execute curated notebooks
        if: matrix.python-version == '3.12'
        run: uv run --python ${{ matrix.python-version }} python scripts/verify_notebooks.py

      - name: Run offline golden & scaling benchmark
        if: matrix.python-version == '3.12'
        run: uv run --python ${{ matrix.python-version }} python benchmarks/run_benchmark.py --scale 1000

      - name: Run offline multi-source stack golden benchmark
        if: matrix.python-version == '3.12'
        run: uv run --python ${{ matrix.python-version }} python benchmarks/multisource_stack_benchmark.py --strict-regression
